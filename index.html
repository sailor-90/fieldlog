<title>Weekly Report</title>
<style>
  :root {
    --bg:#f2f5fa; --card:#fff; --ink:#0f1b2d; --mute:#66758b; --line:#e4e9f1; --soft:#eef3fb;
    --brand:#1668e3; --brand2:#0ea5a4; --ok:#15a34a; --warn:#d98a06; --bad:#dc2626;
    --grad:linear-gradient(135deg,#1668e3 0%,#0ea5a4 100%);

  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0a101c; --card:#121b2d; --ink:#e9eef6; --mute:#8d9bb0; --line:#23304a; --soft:#1a2740;
    --brand:#4d90f5; --brand2:#2cc5c2; --ok:#37c26d; --warn:#f0a82b; --bad:#f06b6b; --shadow:0 8px 28px rgba(0,0,0,.35);
  } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; min-height:100vh; min-height:100dvh; -webkit-text-size-adjust:100%; overscroll-behavior-y:none; }
  button, input, select { font:inherit; color:inherit; }
  svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* top bar */
  .bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:calc(10px + var(--top)) 14px 10px;
    background:var(--bg); background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .bar h1 { flex:1; margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ibtn { width:40px; height:40px; border-radius:14px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; font-size:20px; cursor:pointer; }
  main { max-width:640px; margin:0 auto; padding:6px 16px calc(28px + var(--bot)); }

  /* surfaces */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .hero { background:var(--grad); color:#fff; border-radius:26px; padding:22px 20px; margin-bottom:16px; box-shadow:0 14px 34px rgba(22,104,227,.28); position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.12); }
  .hero h2 { margin:0 0 4px; font-size:24px; letter-spacing:-.02em; } .hero p { margin:0; opacity:.9; font-size:14px; }
  .logo { width:64px; height:64px; border-radius:20px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:34px; margin-bottom:14px; }
  .mute { color:var(--mute); } small, .small { font-size:13px; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border:0; border-radius:14px; background:var(--grad); color:#fff; font-weight:650; cursor:pointer; width:100%; }
  .btn.ghost { background:var(--soft); color:var(--brand); }
  .btn.danger { background:var(--bad); }
  .btn.sm { min-height:42px; padding:0 12px; font-size:14px; border-radius:12px; }
  .btn:disabled { opacity:.45; pointer-events:none; }
  .btn:active, .tile:active, .mod:active, .wk:active, .row-i:active { transform:scale(.985); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 6px; font-weight:600; }
  textarea.f { width:100%; min-height:130px; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); font:inherit; font-size:16px; line-height:1.45; outline:none; resize:vertical; display:block; }
  textarea.f:focus, input.f:focus, select.f:focus { border-color:var(--brand); }
  input.f, select.f { width:100%; min-height:50px; padding:0 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); font-size:16px; outline:none; }
  input.f:focus, select.f:focus { border-color:var(--brand); }
  input.f:disabled { opacity:.55; }

  /* home modules */
  .mod { display:flex; align-items:center; gap:14px; padding:18px; border-radius:22px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:14px; cursor:pointer; width:100%; text-align:left; }
  .mod .ico { width:54px; height:54px; border-radius:18px; display:grid; place-items:center; font-size:28px; color:#fff; flex:none; }
  .mod b { display:block; font-size:17px; letter-spacing:-.01em; } .mod span.s { color:var(--mute); font-size:13px; }
  .mod .go { margin-left:auto; color:var(--mute); font-size:20px; }
  .tag.now { background:var(--soft); background:color-mix(in srgb,var(--brand) 16%,transparent); color:var(--brand); }
  .tag { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:700; background:var(--soft); color:var(--mute); margin-left:8px; vertical-align:middle; }

  /* week cards */
  .wk { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; }
  .wk.locked { opacity:.55; cursor:default; }
  .wk .t { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:17px; }
  .wk .t .n { width:38px; height:38px; border-radius:12px; background:var(--grad); color:#fff; display:grid; place-items:center; font-size:17px; margin-right:12px; flex:none; }
  .wk .meta { display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--mute); font-size:13px; margin-top:10px; }
  .bar2 { height:8px; border-radius:99px; background:var(--soft); overflow:hidden; margin-top:12px; } .bar2 i { display:block; height:100%; background:var(--grad); border-radius:99px; transition:width .4s; }

  /* action tiles */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .sync { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:18px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); margin-bottom:14px; }
  .sync.pend { border-color:#f59e0b; background:rgba(245,158,11,.10); }
  .sync b { display:block; } .sync small { color:var(--mute); }
  .tile { display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:16px; border-radius:20px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); cursor:pointer; text-align:left; min-height:118px; }
  .tile .c { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:22px; color:#fff; }
  .tile b { font-size:16px; } .tile small { color:var(--mute); line-height:1.25; display:block; }
  .tile:disabled { opacity:.5; pointer-events:none; }
  .sect { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:22px 4px 10px; }

  /* item rows */
  .row-i { display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:8px; cursor:pointer; }
  .row-i .no { min-width:42px; height:34px; border-radius:11px; background:var(--soft); color:var(--brand); font-weight:800; display:grid; place-items:center; font-size:14px; padding:0 6px; }
  .row-i .tx { flex:1; font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; background:var(--soft); color:var(--mute); }
  .chip.Yes { background:var(--soft); background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); }
  .chip.No { background:var(--soft); background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); }
  .chip.NA { background:var(--soft); background:color-mix(in srgb,var(--mute) 18%,transparent); color:var(--mute); }
  .chip.todo { background:var(--soft); background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn); }
  .grp { font-size:13px; font-weight:700; color:var(--mute); margin:18px 4px 8px; }
  .filters { display:flex; gap:8px; margin:2px 0 6px; overflow:auto; }
  .filters button { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:7px 14px; font-size:13px; font-weight:650; color:var(--mute); white-space:nowrap; cursor:pointer; }
  .filters button.on { background:var(--grad); color:#fff; border-color:transparent; }

  /* item detail */
  .desc { font-size:13.5px; line-height:1.5; margin:8px 0 0; } .desc.id { color:var(--mute); font-size:12.5px; }
  .slot { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .slot-h { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .pill { background:var(--soft); color:var(--brand); border-radius:10px; padding:3px 9px; font-weight:800; font-size:13px; flex:none; }
  .slot-h .cap { flex:1; font-size:14px; line-height:1.35; } .slot-h .cap b { font-weight:650; } .slot-h .id { color:var(--mute); font-size:12px; }
  .photos { display:grid; gap:10px; margin-bottom:10px; } .photos.two { grid-template-columns:1fr 1fr; } .photos .photo { margin-bottom:0; }
  .photo { position:relative; border-radius:16px; overflow:hidden; background:var(--soft); aspect-ratio:4/3; margin-bottom:10px; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .tools { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .tb { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 2px; border-radius:14px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font:inherit; font-size:10.5px; font-weight:600; line-height:1.15; text-align:center; cursor:pointer; }
  .tb .i { font-size:22px; color:var(--brand); } .tb:active { transform:scale(.96); }
  .sl { margin-top:12px; } .sl label { display:flex; justify-content:space-between; margin:0 0 6px; } .sl input[type=range] { width:100%; accent-color:var(--brand); height:28px; }
  .ratios { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; } .chipb { padding:8px 14px; border-radius:99px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font:inherit; font-size:13px; font-weight:600; cursor:pointer; } .chipb.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .cropbox { position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,.55); cursor:move; touch-action:none; }
  .cropbox .hd { position:absolute; width:30px; height:30px; background:#fff; border:3px solid var(--brand); border-radius:50%; touch-action:none; }
  .cropbox .hd[data-h=nw] { left:-15px; top:-15px; } .cropbox .hd[data-h=ne] { right:-15px; top:-15px; } .cropbox .hd[data-h=sw] { left:-15px; bottom:-15px; } .cropbox .hd[data-h=se] { right:-15px; bottom:-15px; }
  #pvbox { overflow:hidden; border-radius:14px; padding:16px; background:var(--soft); } .pvin { position:relative; }
  .photo .del.ed { right:56px; }
  .photo .loc { position:absolute; left:10px; bottom:10px; padding:3px 9px; border-radius:99px; background:rgba(245,158,11,.92); color:#1b1200; font-size:11px; font-weight:700; }
  .photo .del { position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:12px; border:0; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center; font-size:18px; cursor:pointer; }
  .empty { border:2px dashed var(--line); border-radius:16px; aspect-ratio:16/7; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--mute); font-size:13px; margin-bottom:10px; }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .seg button { min-height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-weight:750; font-size:16px; cursor:pointer; }
  .seg button.on.Yes { background:var(--ok); border-color:var(--ok); color:#fff; } .seg button.on.No { background:var(--bad); border-color:var(--bad); color:#fff; } .seg button.on.NA { background:var(--mute); border-color:var(--mute); color:#fff; }
  .pager { position:sticky; bottom:calc(8px + var(--bot)); display:grid; grid-template-columns:52px 1fr 52px; gap:10px; align-items:center; margin-top:6px; background:var(--card); background:color-mix(in srgb,var(--card) 90%,transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:18px; padding:8px; box-shadow:var(--shadow); }
  .pager .mid { text-align:center; font-weight:700; font-size:14px; } .pager .ibtn { width:100%; height:44px; }

  /* sheets, toast, busy */
  .modal { position:fixed; inset:0; z-index:30; background:rgba(8,14,26,.55); display:flex; align-items:flex-end; justify-content:center; padding:0; animation:fade .18s; }
  .sheet { background:var(--card); border-radius:26px 26px 0 0; padding:20px 18px calc(18px + var(--bot)); width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow:auto; animation:up .22s; }
  .sheet h3 { margin:0 0 6px; font-size:19px; } .sheet p { margin:0 0 14px; color:var(--mute); font-size:14px; white-space:pre-line; }
  @media (min-width:700px) { .modal { align-items:center; padding:16px; } .sheet { border-radius:26px; } }
  @keyframes up { from { transform:translateY(30px); opacity:0 } } @keyframes fade { from { opacity:0 } }
  #toast { position:fixed; left:50%; bottom:calc(22px + var(--bot)); transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 32px); max-width:520px; }
  .tst { background:#0f1b2d; color:#fff; padding:12px 16px; border-radius:14px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); animation:up .2s; width:100%; text-align:center; }
  .tst.err { background:var(--bad); } .tst.ok { background:#12803d; }
  #busy { position:fixed; inset:0; z-index:50; background:rgba(8,14,26,.45); display:grid; place-items:center; } #busy > div { display:grid; gap:10px; place-items:center; background:var(--card); padding:22px 26px; border-radius:20px; font-weight:600; max-width:80%; text-align:center; }
  .spin { width:34px; height:34px; border-radius:50%; border:4px solid var(--soft); border-top-color:var(--brand); animation:sp .8s linear infinite; } @keyframes sp { to { transform:rotate(360deg) } }
  .hide { display:none !important; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top; } th { color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .banner { background:var(--soft); background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); border-radius:14px; padding:11px 14px; font-weight:650; font-size:14px; margin-bottom:14px; display:flex; gap:8px; align-items:center; }
  /* ---------- intro animation ---------- */
  #splash { position:fixed; inset:0; z-index:200; overflow:hidden; display:grid; place-items:center; background:radial-gradient(120% 90% at 50% 20%, #1a4fb8 0%, #0e2f6e 45%, #08142e 100%); color:#fff; cursor:pointer; animation:spOut .5s ease 2.9s forwards; }
  #splash.skip { animation:spOut .25s ease forwards; }
  #splash .sp-c { display:grid; justify-items:center; gap:18px; margin-top:-8vh; }
  #splash .sp-logo { width:104px; height:104px; border-radius:30px; display:grid; place-items:center; background:linear-gradient(135deg,#1668e3,#0ea5a4); box-shadow:0 18px 50px rgba(14,165,164,.45), inset 0 0 0 1px rgba(255,255,255,.25); animation:spPop .7s cubic-bezier(.2,1.4,.4,1) .15s both; }
  #splash .sp-logo svg { width:58px; height:58px; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  #splash .d1 { stroke-dasharray:200; stroke-dashoffset:200; animation:spDraw .8s ease .55s forwards; }
  #splash .d2 { stroke-dasharray:12; stroke-dashoffset:12; animation:spDraw .45s ease 1.25s forwards; }
  #splash .sp-t { font-size:30px; font-weight:800; letter-spacing:-.4px; display:flex; gap:0; }
  #splash .sp-t span { opacity:0; transform:translateY(14px); animation:spUp .5s ease forwards; }
  #splash .sp-s { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.7); opacity:0; animation:spUp .6s ease 1.55s forwards; }
  #splash .sp-sea { position:absolute; left:0; right:0; bottom:0; height:34vh; pointer-events:none; }
  #splash .sp-w { position:absolute; left:0; bottom:0; width:200%; height:100%; }
  #splash .w1 { animation:spWave 6s linear infinite; opacity:.35; } #splash .w2 { animation:spWave 4s linear infinite reverse; opacity:.55; } #splash .w3 { animation:spWave 3s linear infinite; opacity:1; }
  #splash .sp-ship { position:absolute; bottom:calc(11vh + 6px); left:-120px; width:110px; animation:spShip 3.2s ease-in-out .2s forwards, spBob 1.6s ease-in-out infinite; }
  #splash .sp-bar { position:absolute; left:50%; bottom:max(26px, env(safe-area-inset-bottom)); width:120px; height:3px; margin-left:-60px; border-radius:3px; background:rgba(255,255,255,.2); overflow:hidden; }
  #splash .sp-bar i { display:block; height:100%; width:100%; background:#fff; transform:scaleX(0); transform-origin:left; animation:spBar 2.7s ease .15s forwards; }
  #splash .sp-n { font-size:22px; font-weight:800; letter-spacing:.32em; padding-left:.32em; color:#fff; opacity:0; animation:spUp .6s ease 1.85s forwards; text-shadow:0 2px 14px rgba(14,165,164,.6); margin-top:-6px; }
  @keyframes spPop { from { opacity:0; transform:scale(.5) rotate(-8deg); } to { opacity:1; transform:none; } }
  @keyframes spDraw { to { stroke-dashoffset:0; } }
  @keyframes spUp { to { opacity:1; transform:none; } }
  @keyframes spWave { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @keyframes spShip { from { left:-120px; } to { left:calc(100% + 20px); } }
  @keyframes spBob { 0%,100% { margin-bottom:0; } 50% { margin-bottom:4px; } }
  @keyframes spBar { to { transform:scaleX(1); } }
  @keyframes spOut { to { opacity:0; transform:scale(1.04); visibility:hidden; } }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration:.01s !important; animation-delay:0s !important; } #splash { animation:spOut .3s ease .9s forwards !important; } #splash .sp-t span, #splash .sp-s { opacity:1; transform:none; } #splash .d1,#splash .d2 { stroke-dashoffset:0; } }
</style>

<div id="splash" aria-hidden="true">
  <div class="sp-c">
    <div class="sp-logo"><svg viewBox="0 0 24 24"><path class="d1" d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect class="d1" x="8" y="2" width="8" height="4" rx="1"/><path class="d2" d="M9 14l2 2 4-4"/></svg></div>

  </div>

  <div class="sp-sea">
    <svg class="sp-w w1" viewBox="0 0 800 100" preserveAspectRatio="none"><path d="M0 40 Q50 10 100 40 T200 40 T300 40 T400 40 T500 40 T600 40 T700 40 T800 40 V100 H0z" fill="#4d90f5"/></svg>
    <svg class="sp-w w2" viewBox="0 0 800 100" preserveAspectRatio="none"><path d="M0 55 Q50 25 100 55 T200 55 T300 55 T400 55 T500 55 T600 55 T700 55 T800 55 V100 H0z" fill="#2c78e0"/></svg>
    <svg class="sp-w w3" viewBox="0 0 800 100" preserveAspectRatio="none"><path d="M0 70 Q50 45 100 70 T200 70 T300 70 T400 70 T500 70 T600 70 T700 70 T800 70 V100 H0z" fill="#0b2a63"/></svg>
  </div>
  <div class="sp-bar"><i></i></div>

<script>(function(){try{if(sessionStorage.getItem('splash')){var s=document.getElementById('splash');if(s)s.remove();return;}sessionStorage.setItem('splash','1');}catch(e){}
  var sp = document.getElementById('splash'); if (!sp) return;

async function signIn(code, remember, auto) {
  S.code = code;
  try {
    const d = await busy('Memeriksa…', () => api('login'));
    Object.assign(S, { role:d.role, officers:d.officers, period:d.period, forms:d.forms || [], defaults:d.defaults || {} });
    store.set('code', remember ? code : '');
    if (d.period && d.period.shipName) store.set('ship', d.period.shipName);
    try { idb.setMeta('login', { code, role:d.role, officers:d.officers, period:d.period, forms:d.forms || [], defaults:d.defaults || {} }); } catch {}
    if (d.role === 'master') return reset('master');
    const saved = store.get('officer');
    if (auto && saved && d.officers.includes(saved)) {          // remembered device: straight to the home screen
      S.officer = saved; await busy('Memuat data…', refresh); return reset('home');
    }
    reset('who');
  } catch (e) {
    const offline = !navigator.onLine || /load failed|failed to fetch|network/i.test(e.message || '');
    if (auto && offline) {                                       // no connection: open with what the phone has
      try {
        const lg = await idb.getMeta('login'), st = await idb.getMeta('state'), saved = store.get('officer');
        if (lg && st && lg.code === code && lg.role === 'officer' && saved) {
          Object.assign(S, { role:'officer', officers:lg.officers, period:lg.period, forms:lg.forms, defaults:lg.defaults, officer:saved,
            items:st.items || [], photos:st.photos || [], answers:st.answers || {}, captions:st.captions || {} });
          S.answers0 = JSON.parse(JSON.stringify(S.answers)); S.captions0 = JSON.parse(JSON.stringify(S.captions)); applyOut();
          reset('home'); return toast('Offline: memakai data terakhir di HP', 'ok');
        }
      } catch {}
    }
    S.code = ''; if (auto && !offline) store.set('code', '');
    reset('login'); toast(offline ? 'Tidak ada koneksi. Buka lagi saat ada sinyal.' : e.message, 'err');
  }
}

  }

}

function item(t) {

  const slots = def.slots.map((sl, k) => {
    const ps = photosOf(def.item, k), cap = S.captions[`${def.item}:${k}`];
    const photos = ps.length ? `<div class="photos ${ps.length > 1 ? 'two' : ''}">${ps.map((p) => `<div class="photo" data-id="${p.id}"><img alt="">${p.local ? '<span class="loc">di HP</span>' : ''}${p.local ? `<button class="del ed" data-act="edt" data-pid="${p.id}" aria-label="Edit foto">${ic('edit')}</button>` : p.hasBase ? `<button class="del ed" data-act="edc" data-pid="${p.id}" aria-label="Edit foto">${ic('edit')}</button>` : ''}<button class="del" data-act="del" data-pid="${p.id}" aria-label="Hapus foto">${ic('trash')}</button></div>`).join('')}</div>` : `<div class="empty">${ic('cam', 28)}Belum ada foto</div>`;
    const add = ps.length < 2 ? `<div class="two"><button class="btn sm" data-act="cam">${ic('cam')} ${ps.length ? 'Foto ke-2' : 'Kamera'}</button><button class="btn sm ghost" data-act="gal">${ic('img')} Galeri</button></div>` : '<p class="mute small" style="margin:0;text-align:center">Maksimal 2 foto per slot. Hapus salah satu untuk mengganti.</p>';
    return `<div class="slot" data-s="${k}"><div class="slot-h"><span class="pill">${esc(sl.id)}</span><div class="cap"><b>${esc(cap || sl.label)}</b>${!cap && sl.labelId ? ` <span class="id">(${esc(sl.labelId)})</span>` : ''}</div>
      <button class="ibtn" data-act="cap" style="width:36px;height:36px;font-size:17px" aria-label="Edit keterangan">${ic('edit')}</button></div>${photos}${add}</div>`;
  }).join('');
  main.innerHTML = `<div class="card"><span class="chip">${esc(def.section)}</span><p class="desc">${esc(def.text)}</p>${def.textId ? `<p class="desc id">${esc(def.textId)}</p>` : ''}</div>
    ${slots || '<div class="card mute" style="text-align:center">Item ini tidak memerlukan foto. Cukup pilih hasilnya.</div>'}
    <div class="card"><b>Hasil</b><div class="seg" style="margin-top:10px">${['Yes', 'No', 'NA'].map((v) => `<button class="${a.answer === v ? 'on ' + v : ''}" data-ans="${v}" ${blocked ? 'disabled' : ''}>${v}</button>`).join('')}</div>
      <label>Remarks (opsional)</label><input class="f" id="rem" value="${esc(a.remarks || '')}" placeholder="Kosongkan jika tidak perlu" ${blocked ? 'disabled' : ''}>
      ${blocked ? `<p class="mute small">Diisi oleh ${esc(a.officer)}</p>` : ''}</div>
    <div class="pager"><button class="ibtn" id="pv" ${idx <= 0 ? 'disabled style="opacity:.35"' : ''} aria-label="Sebelumnya">${ic('back')}</button><div class="mid">${idx + 1} / ${list.length}</div><button class="ibtn" id="nx" ${idx >= list.length - 1 ? 'disabled style="opacity:.35"' : ''} aria-label="Berikutnya">${ic('chev')}</button></div>`;
  $$('.photo').forEach(loadThumb);
  $$('[data-act]').forEach((b) => b.onclick = () => act(b, def));
  const save = async (answer) => {
    try {
      const remarks = $('#rem').value.trim();
      await outAdd({ type:'answer', item:def.item, answer, remarks });
      if (answer) S.answers[def.item] = { answer, remarks, officer:S.officer }; else delete S.answers[def.item];
      item(t);
    } catch (e) { toast(e.message, 'err'); }
  };
  $$('[data-ans]').forEach((b) => b.onclick = () => save(a.answer === b.dataset.ans ? '' : b.dataset.ans));
  $('#rem').onchange = () => { if (a.answer) save(a.answer); else toast('Pilih Yes/No/NA dulu agar remarks tersimpan'); };
  const move = (d) => { stack[stack.length - 1] = { view:'item', w:t.w, item:list[idx + d].item }; render(); window.scrollTo(0, 0); };
  $('#pv').onclick = () => move(-1); $('#nx').onclick = () => move(1);
}

async function loadThumb(el) {
  const id = el.dataset.id, img = $('img', el);
  if (isLocal(id)) { const o = OUT.find((x) => x.id === id); if (o) img.src = 'data:image/jpeg;base64,' + o.b64; return; }
  if (!thumbCache[id]) { try { const d = await api('photo', { id }); thumbCache[id] = 'data:image/jpeg;base64,' + d.data; } catch { return; } }
  img.src = thumbCache[id];
}

let pending = null, storageAsked = false;
async function act(btn, def) {
  const what = btn.dataset.act, slot = +btn.closest('.slot').dataset.s;
  if (what === 'cam' || what === 'gal') { pending = { slot, item:def.item }; $(what === 'cam' ? '#cam' : '#gal').click(); return; }
  try {
    if (what === 'cap') {
      const key = `${def.item}:${slot}`, base = def.slots[slot].label;
      const v = await askText({ title:'Edit keterangan foto', msg:'Teks ini dicetak berwarna merah di bawah foto pada laporan. Kosongkan untuk kembali ke teks asli.', value:S.captions[key] || base });
      if (v === null) return;
      const text = v.trim() === base ? '' : v.trim();
      await outAdd({ type:'caption', item:def.item, slot, text });
      if (text) S.captions[key] = text; else delete S.captions[key];
    } else if (what === 'edc') {
      const cp = S.photos.find((x) => x.id === btn.dataset.pid); if (!cp) return;
      let b64; try { b64 = (await busy('Mengambil foto asli…', () => api('photoBase', { id:cp.id }))).data; } catch (e) { return toast(/fetch|load failed|network/i.test(e.message) ? 'Butuh koneksi untuk mengedit foto yang sudah di cloud.' : e.message, 'err'); }
      const r = await stage(await b64ToCanvas(b64), new Date(cp.photoTime || Date.now()), 'Edit foto');
      if (!r) return;
      const c = await toJpeg(stamped(scaleTo(r.canvas, CFG.MAX_SIDE), r.when));
      const base = await toJpeg(scaleTo(r.canvas, 800), .8);
      await outAdd({ type:'photo', item:def.item, slot, b64:c.b64, base:base.b64, photoTime:r.when.toISOString(), replaceId:cp.id });
      toast('Perubahan tersimpan di HP. Upload untuk menggantikan foto di cloud.', 'ok');
    } else if (what === 'edt') {
      const o = OUT.find((x) => x.id === btn.dataset.pid);
      if (!o || !o.base) return toast('Foto asli tidak tersimpan, hapus lalu ambil ulang.', 'err');
      const src = await busy('Membuka foto…', () => b64ToCanvas(o.base));
      const r = await stage(src, new Date(o.photoTime), 'Edit foto');
      if (!r) return;
      const c = await toJpeg(stamped(scaleTo(r.canvas, CFG.MAX_SIDE), r.when));
      const base = await toJpeg(scaleTo(r.canvas, 800), .8);
      Object.assign(o, { b64:c.b64, base:base.b64, photoTime:r.when.toISOString() }); await outPut(o);
      toast('Foto diperbarui', 'ok');
    } else if (what === 'del') {
      if (!(await ask({ title:'Hapus foto ini?', msg:'Foto akan dihapus dari laporan.', ok:'Hapus', danger:true }))) return;
      const pid = btn.dataset.pid;
      if (isLocal(pid)) await outDel(pid); else await outAdd({ type:'delPhoto', photoId:pid });
    }
    render();
  } catch (e) { toast(e.message, 'err'); }
}

async function handleFile(f, fromCamera) {
  if (!f || !pending) return;
  const { slot, item: itemNo } = pending, pw = pending.w ? pending : null;
  const when0 = fromCamera ? new Date() : new Date(f.lastModified || Date.now());   // gallery: file time (editable)
  try {
    const canvas = await busy('Membaca foto…', () => loadCanvas(f));
    const r = await stage(canvas, when0, 'Pratinjau foto', { stamp:!pw });
    if (!r) return;
    if (pw) {
      const wj = await wJpeg(r.canvas);
      await outAdd({ type:'wphoto', periodId:wPid(), section:pw.section, day:pw.day, b64:wj.b64, photoTime:r.when.toISOString() });
      if (!storageAsked && navigator.storage && navigator.storage.persist) { storageAsked = true; navigator.storage.persist().catch(() => {}); }
      toast('Foto tersimpan di HP', 'ok'); render(); return;
    }
    const c = await toJpeg(stamped(scaleTo(r.canvas, CFG.MAX_SIDE), r.when));
    const base = await toJpeg(scaleTo(r.canvas, 800), .8);          // unstamped copy: lets the date/time and edits be changed while the photo is still on the phone
    await outAdd({ type:'photo', item:itemNo, slot, b64:c.b64, base:base.b64, photoTime:r.when.toISOString() });
    if (!storageAsked && navigator.storage && navigator.storage.persist) { storageAsked = true; navigator.storage.persist().catch(() => {}); }
    toast('Foto tersimpan di HP', 'ok');
  } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  render();
}
$('#cam').onchange = (e) => { handleFile(e.target.files[0], true); e.target.value = ''; };
$('#gal').onchange = (e) => { handleFile(e.target.files[0], false); e.target.value = ''; };

async function loadAll() {
  try {
    await busy('Memuat data terbaru…', async () => { Object.keys(thumbCache).forEach((k) => delete thumbCache[k]); await refresh(); });

async function downloadPdf() {
  if (OUT.length) {
    if (!(await ask({ title:'Masih ada yang di HP', msg:`${pendingCount().photos} foto dan ${pendingCount().other} perubahan belum di cloud. PDF dibuat dari data cloud, jadi upload dulu.`, ok:'Upload dulu' }))) return;
    if (!(await syncOut()) ) return;
  }
  try {
    await busy('Membuat PDF… (bisa 1–2 menit)', async () => {
      const d = await api('preview');
      const bytes = Uint8Array.from(atob(d.pdf), (c) => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));
      const a = document.createElement('a'); a.href = url; a.download = `FSC ${S.period ? S.period.label : ''} Week ${S.period ? S.period.activeWeek : ''} - ${S.officer}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });
    toast('PDF dibuat dan diunduh', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

async function wRefresh() {

async function wAct(btn, sec, d) {
  const what = btn.dataset.wa;
  try {
    if (what === 'cam' || what === 'gal') { pending = { w:true, section:sec, day:d }; $(what === 'cam' ? '#cam' : '#gal').click(); return; }
    if (what === 'del') {
      if (!(await ask({ title:'Hapus foto ini?', msg:'Foto akan dihapus dari laporan.', ok:'Hapus', danger:true }))) return;
      const pid = btn.dataset.pid;
      if (isLocal(pid)) await outDel(pid); else await outAdd({ type:'wdel', periodId:wPid(), photoId:pid, section:sec });
    } else if (what === 'edt' || what === 'edc') {
      let src, when, o, cp;
      if (what === 'edt') {
        o = OUT.find((x) => x.id === btn.dataset.pid);
        if (!o) return;
        src = await busy('Membuka foto…', () => b64ToCanvas(o.b64)); when = new Date(o.photoTime);
      } else {
        cp = S.w.photos.find((x) => x.id === btn.dataset.pid); if (!cp) return;
        let b64; try { b64 = (await busy('Mengambil foto…', () => api('wPhoto', { id:cp.id }))).data; } catch (e) { return toast(/fetch|load failed|network/i.test(e.message) ? 'Butuh koneksi untuk mengedit foto yang sudah di cloud.' : e.message, 'err'); }
        src = await b64ToCanvas(b64); when = new Date(cp.photoTime || Date.now());

      const r = await stage(src, when, 'Edit foto', { stamp:false });
      if (!r) return;
      const wj = await wJpeg(r.canvas);
      if (o) { Object.assign(o, { b64:wj.b64 }); await outPut(o); }
      else await outAdd({ type:'wphoto', periodId:wPid(), section:sec, day:d, b64:wj.b64, photoTime:cp.photoTime || new Date().toISOString(), replaceId:cp.id });
      toast(o ? 'Foto diperbarui' : 'Perubahan tersimpan di HP. Upload untuk menggantikan foto di cloud.', 'ok');
    }
    render();
  } catch (e) { toast(e.message, 'err'); }
}

/* signatures: remove the paper background, keep the ink, crop tight, navy on transparent */
async function cleanSignature(file) {
  const src = scaleTo(await loadCanvas(file), 900), W = src.width, H = src.height;
  const px = src.getContext('2d').getImageData(0, 0, W, H).data, lum = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) { const a = px[i * 4 + 3] / 255; lum[i] = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) * a + 255 * (1 - a); }
  const sortedL = Float32Array.from(lum).sort(), inkRaw = sortedL[Math.floor((sortedL.length - 1) * 0.01)];
  const BX = Math.max(3, Math.min(8, Math.floor(W / 40))), BY = Math.max(3, Math.min(8, Math.floor(H / 40))), grid = new Float32Array(BX * BY);
  for (let by = 0; by < BY; by++) for (let bx = 0; bx < BX; bx++) {
    const v = []; for (let y = Math.floor(by * H / BY); y < Math.floor((by + 1) * H / BY); y++) for (let x = Math.floor(bx * W / BX); x < Math.floor((bx + 1) * W / BX); x++) v.push(lum[y * W + x]);
    v.sort((a, b) => a - b); grid[by * BX + bx] = v.length ? v[Math.floor((v.length - 1) * 0.85)] : 255;
  }
  const bgAt = (x, y) => {
    const gx = Math.max(0, Math.min(BX - 1, (x + .5) / W * BX - .5)), gy = Math.max(0, Math.min(BY - 1, (y + .5) / H * BY - .5));
    const x0 = Math.floor(gx), y0 = Math.floor(gy), x1 = Math.min(BX - 1, x0 + 1), y1 = Math.min(BY - 1, y0 + 1), fx = gx - x0, fy = gy - y0;
    return (grid[y0 * BX + x0] * (1 - fx) + grid[y0 * BX + x1] * fx) * (1 - fy) + (grid[y1 * BX + x0] * (1 - fx) + grid[y1 * BX + x1] * fx) * fy;
  };
  const al = new Float32Array(W * H); let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const bg = bgAt(x, y), ink = Math.min(inkRaw, bg - 70); let v = (bg - lum[y * W + x]) / (bg - ink);
    v = Math.max(0, Math.min(1, v)); v = Math.pow(v, 0.75); if (v < 0.2) v = 0; al[y * W + x] = v;
    if (v > 0.3) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  if (maxX < 0) throw new Error('Tanda tangan tidak terdeteksi. Pakai foto di kertas putih dengan tinta gelap.');
  const pad = Math.max(3, Math.round(0.04 * Math.max(maxX - minX, maxY - minY)));
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
  const ow = maxX - minX + 1, oh = maxY - minY + 1, out = mkCanvas(ow, oh), og = out.getContext('2d'), id = og.createImageData(ow, oh);
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) { const o = (y * ow + x) * 4; id.data[o] = 16; id.data[o + 1] = 24; id.data[o + 2] = 70; id.data[o + 3] = Math.round(255 * al[(minY + y) * W + minX + x]); }
  og.putImageData(id, 0, 0);
  const fin = scaleTo(out, 600), png = fin.toDataURL('image/png').split(',')[1];
  return { canvas:fin, b64:png };
}

    <label>Tanda tangan</label><div id="kp" style="background:repeating-conic-gradient(#e8edf5 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px;min-height:70px;display:grid;place-items:center;padding:8px"><span class="small mute">${c && c.hasSig ? 'Tanda tangan tersimpan. Pilih foto baru untuk mengganti.' : 'Belum ada'}</span></div>
    <p class="mute small" style="margin:6px 0 0">Foto tanda tangan di kertas putih. Latar dibuang otomatis.</p>
    <div class="two" style="margin-top:8px"><button class="btn sm ghost" id="kcam">${ic('cam')} Kamera</button><button class="btn sm ghost" id="kgal">${ic('img')} Galeri</button></div>
    <label style="display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px;font-weight:500"><input type="checkbox" id="ka" style="width:20px;height:20px" ${!c || c.active ? 'checked' : ''}> Aktif (muncul di daftar pilihan)</label>
    <div class="two" style="margin-top:14px"><button class="btn ghost" id="n">Batal</button><button class="btn" id="y">Simpan</button></div>`);
  if (c && c.hasSig) api('wCrewSig', { crewId:c.crewId }).then((d) => { if (!sig) $('#kp', m).innerHTML = `<img src="data:image/png;base64,${d.data}" alt="" style="max-height:80px;max-width:100%">`; }).catch(() => {});
  const pick = (capture) => {
    const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; if (capture) f.capture = 'environment';
    f.onchange = async () => {
      if (!f.files[0]) return;
      try { const r = await busy('Membersihkan tanda tangan…', () => cleanSignature(f.files[0])); sig = r; r.canvas.style.cssText = 'max-height:90px;max-width:100%'; $('#kp', m).replaceChildren(r.canvas); }
      catch (e) { toast(e.message, 'err'); }
    };
    f.click();
  };
  $('#kcam', m).onclick = () => pick(true); $('#kgal', m).onclick = () => pick(false);
  $('#n', m).onclick = () => m.remove();
  $('#y', m).onclick = async () => {
    try {
      await busy('Menyimpan…', () => api('wCrewSave', { crewId:c ? c.crewId : '', shortName:$('#ks', m).value, fullName:$('#kf', m).value, rank:$('#kr', m).value, active:$('#ka', m).checked, sig:sig ? sig.b64 : '' }));
      m.remove(); wcrew();
    } catch (e) { toast(e.message, 'err'); }
  };
}

// master: a button to the weekly module at the top of the master screen
{
  const _master = master;
  master = async function (t) {
    await _master(t);
    if (cur().view !== 'master') return;
    main.insertAdjacentHTML('afterbegin', `<button class="mod" id="mwk" style="margin-bottom:14px"><span class="ico" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">${ic('wrench', 28)}</span><div><b>Weekly Deck &amp; Engine Report</b><span class="s">Buat laporan, kru, ambil file</span></div><span class="go">${ic('chev')}</span></button>`);
    $('#mwk').onclick = async () => { try { await busy('Memuat…', wRefresh); go('wk'); } catch (e) { toast(e.message, 'err'); } };
  };
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
history.replaceState({ n:1 }, '');
window.addEventListener('online', () => { if (store.get('auto') === '1' && OUT.length && S.role === 'officer') syncOut(true); });
const savedCode = store.get('code');
outLoad().then(() => { if (savedCode) signIn(savedCode, true, true); else render(); });
</script>
</body>
</html>
